gui:
  theme:
    activeBorderColor:
      - '#7E9CD8'
      - bold
    inactiveBorderColor:
      - '#727169'
    optionsTextColor:
      - '#7FB4CA'
    selectedLineBgColor:
      - '#2A2A37'
    unstagedChangesColor:
      - '#E46876'
    defaultFgColor:
      - '#DCD7BA'
  scrollHeight: 2

logs:
  timestamps: true
  since: '60m'

stats:
  graphs:
    - caption: CPU (%)
      statPath: DerivedStats.CPUPercentage
      color: green
    - caption: Memory (%)
      statPath: DerivedStats.MemoryPercentage
      color: blue
