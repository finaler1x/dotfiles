gui:
  theme:
    activeBorderColor:
      - '#7E9CD8'
      - bold
    inactiveBorderColor:
      - '#727169'
    optionsTextColor:
      - '#7FB4CA'
    selectedLineBgColor:
      - '#2A2A37'
    selectedRangeBgColor:
      - '#2A2A37'
    cherryPickedCommitBgColor:
      - '#363646'
    cherryPickedCommitFgColor:
      - '#7E9CD8'
    unstagedChangesColor:
      - '#E46876'
    defaultFgColor:
      - '#DCD7BA'
    searchingActiveBorderColor:
      - '#E6C384'
  nerdFontsVersion: '3'
  showRandomTip: false
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  autoFetch: true
  autoRefresh: true
keybinding:
  universal:
    quit: q
    quit-alt1: <c-c>
