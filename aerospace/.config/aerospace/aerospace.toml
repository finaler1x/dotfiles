# === GENERAL ===
after-login-command = []
after-startup-command = []
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[key-mapping]
preset = 'qwerty'

# === GAPS ===
[gaps]
inner.horizontal = 5
inner.vertical   = 5
outer.left       = 5
outer.right      = 5
outer.top        = 5
outer.bottom     = 5

# === MAIN BINDINGS ===
[mode.main.binding]

# Focus windows
ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'
ctrl-alt-left  = 'focus left'
ctrl-alt-down  = 'focus down'
ctrl-alt-up    = 'focus up'
ctrl-alt-right = 'focus right'

# Move windows
ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'
ctrl-alt-shift-left  = 'move left'
ctrl-alt-shift-down  = 'move down'
ctrl-alt-shift-up    = 'move up'
ctrl-alt-shift-right = 'move right'

# Layouts
ctrl-alt-s = 'layout v_accordion'               # stacking
ctrl-alt-w = 'layout h_accordion'               # tabbed
ctrl-alt-e = 'layout tiles horizontal vertical' # toggle split

# Split direction
ctrl-alt-backslash = 'layout h_tiles'
ctrl-alt-minus     = 'layout v_tiles'

# Toggle floating
ctrl-alt-shift-space = 'layout floating tiling'

# Fullscreen
ctrl-alt-f = 'fullscreen'

# Close window
ctrl-alt-shift-q = 'close'

# Reload config
ctrl-alt-shift-c = 'reload-config'

# Open terminal (change path to your preferred terminal)
ctrl-alt-enter = 'exec-and-forget open -n /System/Applications/Utilities/Terminal.app'

# Resize mode
ctrl-alt-r = 'mode resize'

# Iterate through workspaces
ctrl-alt-period = 'workspace next'
ctrl-alt-comma  = 'workspace prev'

# Back and forth between last workspace
ctrl-alt-tab = 'workspace-back-and-forth'

# Move workspace to next monitor
ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Focus monitor
ctrl-alt-shift-period = 'focus-monitor --wrap-around right'
ctrl-alt-shift-comma  = 'focus-monitor --wrap-around left'

# Switch workspaces
ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'
ctrl-alt-6 = 'workspace 6'
ctrl-alt-7 = 'workspace 7'
ctrl-alt-8 = 'workspace 8'
ctrl-alt-9 = 'workspace 9'

# Move window to workspace
ctrl-alt-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-shift-3 = 'move-node-to-workspace 3'
ctrl-alt-shift-4 = 'move-node-to-workspace 4'
ctrl-alt-shift-5 = 'move-node-to-workspace 5'
ctrl-alt-shift-6 = 'move-node-to-workspace 6'
ctrl-alt-shift-7 = 'move-node-to-workspace 7'
ctrl-alt-shift-8 = 'move-node-to-workspace 8'
ctrl-alt-shift-9 = 'move-node-to-workspace 9'

# === RESIZE MODE ===
[mode.resize.binding]
h     = 'resize width -50'
j     = 'resize height +50'
k     = 'resize height -50'
l     = 'resize width +50'
left  = 'resize width -50'
down  = 'resize height +50'
up    = 'resize height -50'
right = 'resize width +50'
shift-h = 'resize width -200'
shift-j = 'resize height +200'
shift-k = 'resize height -200'
shift-l = 'resize width +200'
enter = 'mode main'
esc   = 'mode main'

# === WORKSPACE TO MONITOR ASSIGNMENTS ===
# Remove this section if you only have one monitor
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'secondary'
5 = 'secondary'
6 = 'secondary'
7 = 'secondary'
8 = 'secondary'
9 = 'secondary'

# === APP RULES ===
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.installer'
run = 'layout floating'
