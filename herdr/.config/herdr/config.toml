onboarding = false
[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[keys]
focus_pane_left = ["prefix+h", "ctrl+shift+left"]
focus_pane_down = ["prefix+j", "ctrl+shift+down"]
focus_pane_up = ["prefix+k", "ctrl+shift+up"]
focus_pane_right = ["prefix+l", "ctrl+shift+right"]
previous_tab = ["prefix+p", "ctrl+alt+["]
next_tab = ["prefix+n", "ctrl+alt+]"]
new_tab = ["prefix+c", "ctrl+alt+c"]
split_vertical = ["prefix+v", "ctrl+alt+d"]
split_horizontal = ["prefix+minus", "ctrl+alt+shift+d"]
zoom = ["prefix+z", "ctrl+alt+z"]
workspace_picker = ["prefix+w"]

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = false
